name: Render
on:
  workflow_dispatch:
    inputs:
      scale:
        description: "Output scale (1 = 1080p, 2 = 4K)"
        default: "1"
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci || npm install
      - run: python3 scripts/make_audio.py
      - name: Render
        run: npx remotion render src/index.ts Short out/short.mp4 --codec h264 --crf 17 --scale=${{ github.event.inputs.scale || '1' }} --concurrency=100%
      - uses: actions/upload-artifact@v7
        with:
          name: short
          path: out/short.mp4
